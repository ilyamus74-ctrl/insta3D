# Station key
STATION_NAME="GrafikStation01"

# WireGuard/private IP or hostname
STATION_HOST="10.0.1.8"
STATION_USER="root"
STATION_SSH_KEY="/root/.ssh/id_ed25519"

# Remote working directory on GPU station
STATION_BASE="/home/makler_storage"

# Install missing station packages during install_station.sh (1=yes, 0=check only).
INSTALL_PACKAGES="1"

# Fail install_station.sh if COLMAP is unavailable after package installation/checks.
COLMAP_MODE="podman"
COLMAP_BIN="colmap"
COLMAP_IMAGE="docker.io/colmap/colmap:latest"
COLMAP_MATCHER="sequential"
COLMAP_SEQUENTIAL_OVERLAP="10"
REQUIRE_COLMAP="1"
# COLMAP mesh reconstruction defaults.
MESH_PREVIEW_POISSON_DEPTH="7"
MESH_HQ_POISSON_DEPTH="9"
MESH_PREVIEW_TARGET_FACES="100000"
MESH_HQ_TARGET_FACES="500000"
MESH_MIN_INPUT_VERTICES="500"
MESH_MIN_OUTPUT_FACES="100"
# Open3D mesh generation defaults.
MESH_ENGINE="auto"
OPEN3D_PYTHON="/home/makler_storage/open3d-venv/bin/python"
OPEN3D_PREVIEW_DEPTH="7"
OPEN3D_HQ_DEPTH="9"
OPEN3D_PREVIEW_TARGET_FACES="100000"
OPEN3D_HQ_TARGET_FACES="500000"
OPEN3D_PREVIEW_DENSITY_QUANTILE="0.03"
OPEN3D_HQ_DENSITY_QUANTILE="0.01"
INSTALL_OPEN3D_DEPENDENCIES="0"
