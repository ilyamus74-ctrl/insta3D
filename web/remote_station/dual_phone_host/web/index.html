<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaklerTour Dual Phone Host</title>
<style>
:root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
body { margin: 0; background: #101014; color: #f5f5f7; }
header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; background: #111117; border-bottom: 1px solid #33333d; }
.header-copy { min-width: 0; }
h1 { margin: 0 0 6px; font-size: 20px; }
#summary { font-family: ui-monospace, monospace; font-size: 13px; color: #c9c9d3; }
.header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.profile-control { display: flex; align-items: center; gap: 7px; font-family: ui-monospace, monospace; font-size: 12px; color: #c9c9d3; }
.profile-control select { border: 1px solid #4a4a58; border-radius: 9px; padding: 8px 9px; background: #1d1d25; color: #f5f5f7; }
#stopButton { flex: 0 0 auto; border: 1px solid #6d5361; border-radius: 10px; padding: 9px 12px; background: #2a1820; color: #ffdbe8; cursor: pointer; font-weight: 650; }
#stopButton:hover { background: #3a202b; }
#stopButton:disabled { cursor: wait; opacity: .65; }
.block-title { margin: 14px 14px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.block-title h2 { margin: 0; font-size: 16px; }
.block-title span { font-family: ui-monospace, monospace; font-size: 12px; color: #aaaab7; text-align: right; }
.grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; padding: 12px; }
.camera { position: relative; min-height: 300px; background: #050506; border: 1px solid #33333d; border-radius: 14px; overflow: hidden; }
.camera img { width: 100%; height: 100%; min-height: 300px; object-fit: contain; display: block; }
.raw-camera { min-height: 0; aspect-ratio: 9 / 16; }
.raw-camera img {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 100%;
  height: auto;
  min-height: 0;
  transform-origin: center;
}
.selected-preview { margin: 12px auto; width: min(900px, calc(100% - 24px)); min-height: 420px; aspect-ratio: 9 / 16; }
.selected-preview img { min-height: 420px; }
.label { position: absolute; top: 10px; left: 10px; max-width: calc(100% - 40px); padding: 8px 10px; border-radius: 9px; background: rgba(0,0,0,.76); font-family: ui-monospace, monospace; white-space: pre-line; overflow-wrap: anywhere; }
.ok { color: #72f59a; } .bad { color: #ff7d7d; } .warn { color: #ffd66e; }
details { margin: 12px; padding: 12px; border: 1px solid #33333d; border-radius: 14px; background: #17171d; }
details summary { cursor: pointer; font-weight: 650; }
pre { max-height: 320px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .block-title { align-items: flex-start; flex-direction: column; } }
</style>
</head>
<body>
<header>
  <div class="header-copy">
    <h1>MaklerTour · CPU Laptop Stereo Host</h1>
    <div id="summary">waiting for host…</div>
  </div>
  <div class="header-actions">
    <label class="profile-control">DEPTH
      <select id="depthProfile">
        <option value="AUTO">AUTO</option>
        <option value="FHD_1920">FHD 1920 · load test</option>
        <option value="ULTRA_960">ULTRA 960</option>
        <option value="HIGH_640">HIGH 640</option>
        <option value="QUALITY_480">QUALITY 480</option>
        <option value="BALANCED_320">BALANCED 320</option>
      </select>
    </label>
    <label class="profile-control">VIEW
      <select id="previewMode">
        <option value="DEPTH_FILTERED">FILTERED</option>
        <option value="DEPTH_STRICT">TEMPORAL STRICT</option>
        <option value="DEPTH_RAW">RAW METRIC</option>
        <option value="DISPARITY">DISPARITY</option>
        <option value="CONFIDENCE">CONFIDENCE</option>
      </select>
    </label>
    <button id="stopButton" type="button" title="F8 or Alt+S">
      Stop + pack JSON · F8
    </button>
  </div>
</header>

<div class="block-title">
  <h2>Raw phone uplink</h2>
  <span id="pairStatus">waiting for synchronized frames</span>
</div>
<div class="grid">
  <div class="camera raw-camera"><img id="cameraA" decoding="async"><div id="labelA" class="label">CAMERA_A · WAITING</div></div>
  <div class="camera raw-camera"><img id="cameraB" decoding="async"><div id="labelB" class="label">CAMERA_B · WAITING</div></div>
</div>

<div class="block-title">
  <h2>Live depth preview</h2>
  <span id="depthStatus">AUTO profile waiting</span>
</div>
<div class="camera selected-preview">
  <img id="selectedPreview" decoding="async">
  <div id="selectedLabel" class="label warn">FILTERED · WAITING</div>
</div>

<details id="diagnostics">
  <summary>Calibration and diagnostic JSON</summary>
  <p id="calibrationStatus">waiting for calibration profile</p>
  <pre id="json"></pre>
</details>
<script>
const fmt = n => Number(n || 0).toFixed(1);
const percent = n => `${(Number(n || 0) * 100).toFixed(1)}%`;
const stopButton = document.getElementById('stopButton');
const depthProfile = document.getElementById('depthProfile');
const previewMode = document.getElementById('previewMode');
const summary = document.getElementById('summary');
const pairStatus = document.getElementById('pairStatus');
const calibrationStatus = document.getElementById('calibrationStatus');
const labelA = document.getElementById('labelA');
const labelB = document.getElementById('labelB');
const cameraA = document.getElementById('cameraA');
const cameraB = document.getElementById('cameraB');
const depthStatus = document.getElementById('depthStatus');
const selectedPreview = document.getElementById('selectedPreview');
const selectedLabel = document.getElementById('selectedLabel');
const diagnostics = document.getElementById('diagnostics');
const diagnosticJson = document.getElementById('json');
let stopping = false;
let lastSelectedSequence = -1;
let selectedImageLoading = false;
let lastRawASequence = -1;
let lastRawBSequence = -1;
let refreshInFlight = false;

async function stopAndPack() {
  if (stopping) return;
  if (!window.confirm('Stop the laptop host and package JSON diagnostics?')) return;
  stopping = true;
  stopButton.disabled = true;
  stopButton.textContent = 'Stopping…';
  summary.textContent = 'Stopping host; JSON diagnostics will be packed in the terminal…';
  try {
    const response = await fetch('/api/control/stop', {method: 'POST'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    stopButton.textContent = 'Packaging JSON…';
  } catch (error) {
    stopping = false;
    stopButton.disabled = false;
    stopButton.textContent = 'Stop + pack JSON · F8';
    summary.textContent = `stop failed: ${error}`;
  }
}

stopButton.addEventListener('click', stopAndPack);
depthProfile.addEventListener('change', async () => {
  depthProfile.disabled = true;
  try {
    const response = await fetch(`/api/depth/profile/${depthProfile.value}`, {method: 'POST'});
    if (!response.ok) throw new Error(await response.text());
  } catch (error) {
    summary.textContent = `depth profile change failed: ${error}`;
  } finally {
    depthProfile.disabled = false;
  }
});
previewMode.addEventListener('change', async () => {
  previewMode.disabled = true;
  selectedImageLoading = false;
  lastSelectedSequence = -1;
  try {
    const response = await fetch(
      `/api/depth/preview/${previewMode.value}`,
      {method: 'POST'}
    );
    if (!response.ok) throw new Error(await response.text());
  } catch (error) {
    summary.textContent = `preview change failed: ${error}`;
  } finally {
    previewMode.disabled = false;
  }
});
window.addEventListener('keydown', event => {
  if (event.key === 'F8' || (event.altKey && event.key.toLowerCase() === 's')) {
    event.preventDefault();
    stopAndPack();
  }
});

function cameraLabel(name, camera) {
  const latest = camera.latest || {};
  const clockRtt = Number(latest.clock_rtt_ns || 0) / 1000000;
  return `${name} · ${camera.connected ? 'READY' : 'WAITING'}\n` +
    `${camera.device_id || 'no device'}\n` +
    `${latest.width || 0}×${latest.height || 0} · ${fmt(camera.fps)} FPS\n` +
    `frame ${latest.sequence ?? '—'} · ${(Number(camera.bytes || 0)/1048576).toFixed(1)} MiB\n` +
    `clock ${fmt(clockRtt)} ms · queue ${camera.pair_queue_depth || 0} · dropped ${camera.pair_frames_dropped || 0}`;
}

function orientRawImage(element, camera) {
  const latest = camera.latest || {};
  const rotation = ((Number(latest.rotation_degrees || 0) % 360) + 360) % 360;
  const quarterTurn = rotation === 90 || rotation === 270;

  // A 960×540 buffer rotated by 90° exactly fills a 9:16 card.
  element.style.width = quarterTurn ? '177.7778%' : '100%';
  element.style.height = 'auto';
  element.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;
}

function selectedMetrics(mode, depth, processing) {
  const median = depth.median_depth_m == null
    ? '—'
    : `${Number(depth.median_depth_m).toFixed(2)} m`;
  const jitter = depth.depth_jitter_m == null
    ? '—'
    : `${Number(depth.depth_jitter_m).toFixed(2)} m`;
  switch (mode) {
    case 'DISPARITY':
      return `valid ${percent(processing.valid_disparity_ratio)} · ${fmt(processing.last_duration_ms)} ms`;
    case 'DEPTH_RAW':
      return `valid ${percent(depth.raw_valid_ratio)} · median ${median}`;
    case 'DEPTH_STRICT':
      return `stable ${percent(depth.stable_coverage_ratio)} · jitter ${jitter}`;
    case 'CONFIDENCE':
      return `high ${percent(depth.high_confidence_ratio)} · ${depth.temporal_mode || 'WAITING'} · motion ${fmt(depth.motion_score_percent)}%`;
    default:
      return `valid ${percent(depth.dense_coverage_ratio)} · LR ${fmt(depth.left_right_accepted_percent)}% · median ${median}`;
  }
}

function requestSelectedPreview(sequence) {
  if (sequence <= lastSelectedSequence || selectedImageLoading) return;
  selectedImageLoading = true;
  selectedPreview.onload = () => {
    lastSelectedSequence = sequence;
    selectedImageLoading = false;
  };
  selectedPreview.onerror = () => {
    selectedImageLoading = false;
  };
  selectedPreview.src = `/stereo/selected.jpg?v=${sequence}`;
}

function updateStereo(stereo) {
  const calibration = stereo.calibration || {};
  const processing = stereo.processing || {};
  const previews = stereo.previews || {};
  const depth = stereo.depth || {};
  const ready = calibration.state === 'READY';
  const profile = calibration.profile_id || 'no profile';
  const order = calibration.roles_reversed
    ? 'runtime order reversed'
    : 'profile order';
  calibrationStatus.textContent =
    `${calibration.state || 'UNKNOWN'} · ${profile} · ${order}` +
    (calibration.error ? ` · ${calibration.error}` : '');
  calibrationStatus.className =
    ready ? 'ok' : (calibration.state === 'ERROR' ? 'bad' : 'warn');

  const work = depth.work_width && depth.work_height
    ? `${depth.work_width}×${depth.work_height}`
    : 'pending';
  const upscale = depth.source_upscaled ? ' · UPSCALED SOURCE' : '';
  depthStatus.textContent =
    `${depth.selection_mode || 'AUTO'} → ${depth.active_profile || 'WAITING'} · ${work} · ` +
    `${fmt(depth.target_depth_fps)} target FPS · p95 ${fmt(depth.processing_p95_ms)} ms · ` +
    `load ${fmt(depth.processing_utilization_percent)}%${upscale}`;
  if (depthProfile.value !== depth.selection_mode && !depthProfile.disabled) {
    depthProfile.value = depth.selection_mode || 'AUTO';
  }

  const selectedMode = previews.selected_mode || 'DEPTH_FILTERED';
  if (previewMode.value !== selectedMode && !previewMode.disabled) {
    previewMode.value = selectedMode;
  }
  const title = {
    DISPARITY: 'DISPARITY',
    DEPTH_RAW: 'RAW METRIC',
    DEPTH_FILTERED: 'FILTERED',
    DEPTH_STRICT: 'TEMPORAL STRICT',
    CONFIDENCE: 'CONFIDENCE',
  }[selectedMode] || selectedMode;
  const errorLine = processing.last_error ? `\n${processing.last_error}` : '';
  selectedLabel.textContent =
    `${title} · ${previews.selected_ready ? 'READY' : 'WAITING'}\n` +
    `${selectedMetrics(selectedMode, depth, processing)}${errorLine}`;
  selectedLabel.className =
    `label ${previews.selected_ready ? 'ok' : (processing.last_error ? 'bad' : 'warn')}`;

  const sequence = Number(previews.selected_sequence || 0);
  if (previews.selected_ready && sequence > 0) {
    requestSelectedPreview(sequence);
  }
}

async function refresh() {
  if (refreshInFlight) return;
  refreshInFlight = true;
  try {
    const response = await fetch('/api/status', {cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const status = await response.json();
    labelA.textContent = cameraLabel('CAMERA_A', status.camera_a);
    labelB.textContent = cameraLabel('CAMERA_B', status.camera_b);
    labelA.className = 'label ' + (status.camera_a.connected ? 'ok' : 'bad');
    labelB.className = 'label ' + (status.camera_b.connected ? 'ok' : 'bad');
    const pair = status.pairing;
    const stereo = status.stereo_preview || {};
    const processing = stereo.processing || {};
    const calibration = stereo.calibration || {};
    const depth = stereo.depth || {};
    pairStatus.textContent =
      `Δ ${fmt(pair.last_delta_ms)} ms · ready ${pair.ready_pairs}/${pair.pairs} · ` +
      `queues ${pair.queue_a}/${pair.queue_b} · dropped ${pair.dropped_a}/${pair.dropped_b}`;
    summary.textContent =
      `A ${fmt(status.camera_a.fps)} FPS · B ${fmt(status.camera_b.fps)} FPS · ` +
      `pair Δ ${fmt(pair.last_delta_ms)} ms · rectification ${calibration.state || 'WAITING'} · ` +
      `${depth.active_profile || 'DEPTH WAITING'} · proc ${fmt(processing.fps)} FPS · ` +
      `stable ${percent(depth.stable_coverage_ratio)}`;
    if (diagnostics.open) {
      diagnosticJson.textContent = JSON.stringify(status, null, 2);
    }
    const tick = Date.now();
    const sequenceA = Number(status.camera_a.latest?.sequence ?? -1);
    const sequenceB = Number(status.camera_b.latest?.sequence ?? -1);
    if (sequenceA >= 0 && sequenceA !== lastRawASequence) {
      cameraA.src = `/camera/a.jpg?t=${tick}`;
      lastRawASequence = sequenceA;
    }
    if (sequenceB >= 0 && sequenceB !== lastRawBSequence) {
      cameraB.src = `/camera/b.jpg?t=${tick}`;
      lastRawBSequence = sequenceB;
    }
    orientRawImage(cameraA, status.camera_a);
    orientRawImage(cameraB, status.camera_b);
    updateStereo(stereo);
  } catch (error) {
    summary.textContent = stopping
      ? 'Host stopped; JSON diagnostics are being packed in the terminal.'
      : `dashboard error: ${error}`;
  } finally {
    refreshInFlight = false;
  }
}
setInterval(refresh, 250); refresh();
</script>
</body>
</html>
